name: Evolution notify one-time patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/evolution-notify-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Route scheduled WhatsApp through Evolution API
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/api/cron/notify/route.ts'
          let text = fs.readFileSync(path, 'utf8')

          text = text.replace('  sendWhatsAppMessage,\n', '')
          if (!text.includes("from '@/lib/evolution'")) {
            text = text.replace("} from '@/lib/whatsapp'", "} from '@/lib/whatsapp'\nimport { sendEvolutionText } from '@/lib/evolution'")
          }

          const marker = "  const debug: Record<string, unknown> = { now: now.toISOString() }"
          if (!text.includes('async function sendBusinessWhatsApp(')) {
            const helper = `${marker}\n\n  const evolutionCache = new Map<string, { apiUrl: string; apiKey: string; instance: string } | null>()\n\n  async function evolutionCredentials(businessId: string) {\n    if (evolutionCache.has(businessId)) return evolutionCache.get(businessId) ?? null\n    const { data } = await supabase\n      .from('business_evolution_config')\n      .select('api_url, api_key, instance_name, enabled')\n      .eq('business_id', businessId)\n      .maybeSingle()\n    const config = data?.enabled && data.api_url && data.api_key && data.instance_name\n      ? { apiUrl: data.api_url, apiKey: data.api_key, instance: data.instance_name }\n      : null\n    evolutionCache.set(businessId, config)\n    return config\n  }\n\n  async function sendBusinessWhatsApp(businessId: string, to: string, message: string) {\n    const credentials = await evolutionCredentials(businessId)\n    if (!credentials) return false\n    try {\n      await sendEvolutionText(credentials, to, message)\n      return true\n    } catch (err) {\n      console.error('[cron/notify] Evolution API error:', err)\n      return false\n    }\n  }`
            text = text.replace(marker, helper)
          }

          text = text.replace(/\n\s*const waCredentials = biz\?\.meta_whatsapp_phone_number_id && biz\?\.meta_whatsapp_access_token\n\s*\? \{ phoneNumberId: biz\.meta_whatsapp_phone_number_id, accessToken: biz\.meta_whatsapp_access_token \}\n\s*: undefined/g, '')

          text = text.replace(/await sendWhatsAppMessage\(client\.whatsapp_number,\n([\s\S]*?)\n\s*waCredentials\n\s*\)/g, (_m, msg) => `await sendBusinessWhatsApp(a.business_id, client.whatsapp_number,\n${msg}\n      )`)
          text = text.replace(/await sendWhatsAppMessage\(c\.whatsapp_number,\n([\s\S]*?)\n\s*waCredentials\n\s*\)/g, (_m, msg) => `await sendBusinessWhatsApp(c.business_id, c.whatsapp_number,\n${msg}\n      )`)

          if (text.includes('sendWhatsAppMessage(')) throw new Error('Some legacy WhatsApp calls were not replaced')
          fs.writeFileSync(path, text)
          NODE
      - name: Commit patch
        run: |
          git config user.name "Agelya Bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/api/cron/notify/route.ts'
          git diff --cached --quiet && exit 0
          git commit -m "feat: send scheduled WhatsApp notifications with Evolution API"
          git push
