name: Apply Agelya Foundation

on:
  push:
    branches:
      - agent/agelya-pronto-base

permissions:
  contents: write

jobs:
  foundation:
    if: ${{ !contains(github.event.head_commit.message, '[foundation-complete]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Agelya
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply product foundation
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path
          import json

          # Keep package-lock metadata aligned with package.json.
          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text())
          lock['name'] = 'agelya'
          lock['version'] = '0.1.0'
          root = lock.get('packages', {}).get('')
          if isinstance(root, dict):
              root['name'] = 'agelya'
              root['version'] = '0.1.0'
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n')

          # PT-BR copy focused on wellness/massotherapy instead of generic SMB marketing.
          pt_path = Path('messages/pt.json')
          pt = json.loads(pt_path.read_text())
          pt.setdefault('meta', {})['title'] = 'Agelya — Agenda e gestão para beleza e bem-estar'
          pt['meta']['description'] = 'Agenda, clientes, serviços, caixa e relacionamento para profissionais de beleza, bem-estar e terapias.'
          pt.setdefault('brand', {})['name'] = 'Agelya'
          pt['brand']['tagline'] = 'Agenda · clientes · relacionamento'
          onboarding = pt.get('onboarding', {})
          if isinstance(onboarding.get('step1'), dict):
              onboarding['step1']['serviceNamePlaceholder'] = 'Ex.: Massagem relaxante, drenagem linfática…'
          sidebar = pt.get('sidebar', {})
          if isinstance(sidebar, dict):
              sidebar['booking'] = 'Agenda'
              sidebar['pos'] = 'Caixa'
          dashboard = pt.get('dashboard', {})
          stats = dashboard.get('stats', {}) if isinstance(dashboard, dict) else {}
          if isinstance(stats, dict):
              stats['appointmentsToday'] = 'Atendimentos hoje'
          pt_path.write_text(json.dumps(pt, ensure_ascii=False, indent=2) + '\n')
          PY

          cat > app/layout.tsx <<'EOF'
          import type { Metadata, Viewport } from 'next'
          import { Inter } from 'next/font/google'
          import { NextIntlClientProvider } from 'next-intl'
          import { getLocale, getMessages } from 'next-intl/server'
          import './globals.css'

          const inter = Inter({ subsets: ['latin'] })

          export const metadata: Metadata = {
            title: 'Agelya — Agenda e gestão para beleza e bem-estar',
            description:
              'Agenda, clientes, serviços, caixa e relacionamento para profissionais de beleza, bem-estar e terapias.',
            keywords: [
              'agenda online',
              'massoterapia',
              'gestão de clientes',
              'agendamento online',
              'estética',
              'beleza e bem-estar',
            ],
            manifest: '/site.webmanifest',
            appleWebApp: {
              capable: true,
              statusBarStyle: 'default',
              title: 'Agelya',
            },
            formatDetection: {
              telephone: false,
            },
            icons: {
              icon: [
                { url: '/favicon.ico', sizes: 'any' },
                { url: '/favicon-32x32.png', type: 'image/png', sizes: '32x32' },
                { url: '/favicon-16x16.png', type: 'image/png', sizes: '16x16' },
              ],
              apple: '/apple-touch-icon.png',
            },
            openGraph: {
              title: 'Agelya — Agenda e gestão para beleza e bem-estar',
              description: 'Organize agenda, clientes, serviços e relacionamento em um só lugar.',
              locale: 'pt_BR',
              type: 'website',
            },
            twitter: {
              card: 'summary_large_image',
              title: 'Agelya',
              description: 'Agenda e gestão para profissionais de beleza, bem-estar e terapias.',
            },
          }

          export const viewport: Viewport = {
            themeColor: '#16a34a',
            width: 'device-width',
            initialScale: 1,
            minimumScale: 1,
          }

          export default async function RootLayout({
            children,
          }: {
            children: React.ReactNode
          }) {
            const locale = await getLocale()
            const messages = await getMessages()

            return (
              <html lang={locale}>
                <body className={inter.className}>
                  <NextIntlClientProvider messages={messages}>
                    {children}
                  </NextIntlClientProvider>
                </body>
              </html>
            )
          }
          EOF

          cat > public/site.webmanifest <<'EOF'
          {
            "name": "Agelya",
            "short_name": "Agelya",
            "description": "Agenda e gestão para profissionais de beleza, bem-estar e terapias",
            "icons": [
              { "src": "/android-chrome-192x192.png", "sizes": "192x192", "type": "image/png" },
              { "src": "/android-chrome-512x512.png", "sizes": "512x512", "type": "image/png" }
            ],
            "theme_color": "#16a34a",
            "background_color": "#ffffff",
            "display": "standalone",
            "start_url": "/dashboard",
            "lang": "pt-BR"
          }
          EOF

          cat > public/manifest.json <<'EOF'
          {
            "name": "Agelya — Agenda e Gestão",
            "short_name": "Agelya",
            "description": "Agenda, clientes, serviços e relacionamento para beleza e bem-estar",
            "start_url": "/dashboard",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#16a34a",
            "orientation": "any",
            "lang": "pt-BR",
            "icons": [
              {
                "src": "/icons/icon-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any maskable"
              },
              {
                "src": "/icons/icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              },
              {
                "src": "/icons/icon.svg",
                "sizes": "any",
                "type": "image/svg+xml",
                "purpose": "any"
              }
            ],
            "shortcuts": [
              {
                "name": "Agenda",
                "short_name": "Agenda",
                "description": "Ver e gerenciar atendimentos",
                "url": "/booking",
                "icons": [{ "src": "/icons/icon-192.png", "sizes": "192x192" }]
              },
              {
                "name": "Clientes",
                "short_name": "Clientes",
                "description": "Cadastro e histórico de clientes",
                "url": "/crm",
                "icons": [{ "src": "/icons/icon-192.png", "sizes": "192x192" }]
              },
              {
                "name": "Caixa",
                "short_name": "Caixa",
                "description": "Registrar recebimentos e vendas",
                "url": "/pos",
                "icons": [{ "src": "/icons/icon-192.png", "sizes": "192x192" }]
              }
            ],
            "categories": ["business", "productivity", "health"]
          }
          EOF

          cat > supabase/migrations/035_agelya_wellness_foundation.sql <<'EOF'
          -- Agelya wellness foundation
          -- Adds the first massotherapy/wellness-specific domain objects while
          -- keeping sensitive health data unavailable to anonymous/public roles.

          ALTER TABLE public.businesses
            ALTER COLUMN timezone SET DEFAULT 'America/Sao_Paulo',
            ALTER COLUMN currency SET DEFAULT 'BRL';

          ALTER TABLE public.services
            ADD COLUMN IF NOT EXISTS buffer_after_min integer NOT NULL DEFAULT 0
              CHECK (buffer_after_min >= 0 AND buffer_after_min <= 180);

          CREATE TABLE IF NOT EXISTS public.session_packages (
            id uuid PRIMARY KEY DEFAULT uuid_generate_v4(),
            business_id uuid NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
            client_id uuid NOT NULL REFERENCES public.clients(id) ON DELETE CASCADE,
            name text NOT NULL,
            total_sessions integer NOT NULL CHECK (total_sessions > 0),
            price_paid numeric(10,2) NOT NULL DEFAULT 0 CHECK (price_paid >= 0),
            status text NOT NULL DEFAULT 'active'
              CHECK (status IN ('active', 'completed', 'expired', 'cancelled')),
            purchased_at timestamptz NOT NULL DEFAULT now(),
            expires_at timestamptz,
            notes text,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );

          CREATE TABLE IF NOT EXISTS public.package_session_uses (
            id uuid PRIMARY KEY DEFAULT uuid_generate_v4(),
            business_id uuid NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
            package_id uuid NOT NULL REFERENCES public.session_packages(id) ON DELETE CASCADE,
            appointment_id uuid NOT NULL REFERENCES public.appointments(id) ON DELETE CASCADE,
            used_at timestamptz NOT NULL DEFAULT now(),
            UNIQUE (appointment_id)
          );

          CREATE TABLE IF NOT EXISTS public.client_intake_forms (
            id uuid PRIMARY KEY DEFAULT uuid_generate_v4(),
            business_id uuid NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
            client_id uuid NOT NULL REFERENCES public.clients(id) ON DELETE CASCADE,
            answers jsonb NOT NULL DEFAULT '{}'::jsonb,
            version text NOT NULL DEFAULT '1',
            completed_at timestamptz,
            created_by uuid REFERENCES auth.users(id) ON DELETE SET NULL,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );

          CREATE TABLE IF NOT EXISTS public.client_consents (
            id uuid PRIMARY KEY DEFAULT uuid_generate_v4(),
            business_id uuid NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
            client_id uuid NOT NULL REFERENCES public.clients(id) ON DELETE CASCADE,
            consent_type text NOT NULL,
            version text NOT NULL DEFAULT '1',
            accepted_at timestamptz NOT NULL DEFAULT now(),
            revoked_at timestamptz,
            created_at timestamptz NOT NULL DEFAULT now()
          );

          CREATE TABLE IF NOT EXISTS public.session_notes (
            id uuid PRIMARY KEY DEFAULT uuid_generate_v4(),
            business_id uuid NOT NULL REFERENCES public.businesses(id) ON DELETE CASCADE,
            client_id uuid NOT NULL REFERENCES public.clients(id) ON DELETE CASCADE,
            appointment_id uuid REFERENCES public.appointments(id) ON DELETE SET NULL,
            employee_id uuid REFERENCES public.employees(id) ON DELETE SET NULL,
            pain_scale smallint CHECK (pain_scale BETWEEN 0 AND 10),
            body_areas text[] NOT NULL DEFAULT '{}',
            techniques text[] NOT NULL DEFAULT '{}',
            evolution text,
            client_response text,
            recommendations text,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now(),
            UNIQUE (appointment_id)
          );

          CREATE INDEX IF NOT EXISTS idx_session_packages_business_client
            ON public.session_packages (business_id, client_id);
          CREATE INDEX IF NOT EXISTS idx_package_session_uses_package
            ON public.package_session_uses (package_id, used_at);
          CREATE INDEX IF NOT EXISTS idx_client_intake_forms_business_client
            ON public.client_intake_forms (business_id, client_id, created_at DESC);
          CREATE INDEX IF NOT EXISTS idx_client_consents_business_client
            ON public.client_consents (business_id, client_id, accepted_at DESC);
          CREATE INDEX IF NOT EXISTS idx_session_notes_business_client
            ON public.session_notes (business_id, client_id, created_at DESC);

          ALTER TABLE public.session_packages ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.package_session_uses ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.client_intake_forms ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.client_consents ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.session_notes ENABLE ROW LEVEL SECURITY;

          DROP POLICY IF EXISTS tenant_access_session_packages ON public.session_packages;
          CREATE POLICY tenant_access_session_packages ON public.session_packages
            FOR ALL USING (business_id IN (SELECT public.my_business_ids()));

          DROP POLICY IF EXISTS tenant_access_package_session_uses ON public.package_session_uses;
          CREATE POLICY tenant_access_package_session_uses ON public.package_session_uses
            FOR ALL USING (business_id IN (SELECT public.my_business_ids()));

          DROP POLICY IF EXISTS tenant_access_client_intake_forms ON public.client_intake_forms;
          CREATE POLICY tenant_access_client_intake_forms ON public.client_intake_forms
            FOR ALL USING (business_id IN (SELECT public.my_business_ids()));

          DROP POLICY IF EXISTS tenant_access_client_consents ON public.client_consents;
          CREATE POLICY tenant_access_client_consents ON public.client_consents
            FOR ALL USING (business_id IN (SELECT public.my_business_ids()));

          DROP POLICY IF EXISTS tenant_access_session_notes ON public.session_notes;
          CREATE POLICY tenant_access_session_notes ON public.session_notes
            FOR ALL USING (business_id IN (SELECT public.my_business_ids()));

          -- Health/intake/session data must never be readable by the public booking role.
          REVOKE ALL ON TABLE public.client_intake_forms FROM anon;
          REVOKE ALL ON TABLE public.client_consents FROM anon;
          REVOKE ALL ON TABLE public.session_notes FROM anon;
          REVOKE ALL ON TABLE public.session_packages FROM anon;
          REVOKE ALL ON TABLE public.package_session_uses FROM anon;

          GRANT ALL ON TABLE public.client_intake_forms TO authenticated;
          GRANT ALL ON TABLE public.client_consents TO authenticated;
          GRANT ALL ON TABLE public.session_notes TO authenticated;
          GRANT ALL ON TABLE public.session_packages TO authenticated;
          GRANT ALL ON TABLE public.package_session_uses TO authenticated;
          EOF

          mkdir -p docs/verticals
          cat > docs/verticals/massoterapia.md <<'EOF'
          # Vertical inicial — Massoterapia

          A primeira implantação comercial da Agelya é voltada para uma profissional de massoterapia. O objetivo é manter o painel simples para uso diário, aproveitando a agenda e o CRM maduros da base Pronto e adicionando somente os recursos específicos que geram valor para esse atendimento.

          ## MVP operacional

          1. **Agenda** — dia/semana, criação manual, agendamento público, confirmação, cancelamento, falta e prevenção de conflito.
          2. **Clientes** — cadastro, contato, aniversário, observações, tags e histórico de atendimentos.
          3. **Serviços** — nome, duração, preço, capacidade e intervalo de preparação após a sessão.
          4. **Caixa** — recebimentos de sessões e produtos, forma de pagamento e histórico.
          5. **Pacotes** — quantidade contratada, sessões utilizadas, validade e vínculo com atendimentos.
          6. **Anamnese e consentimento** — dados sensíveis protegidos por RLS e nunca disponíveis ao papel público/anon.
          7. **Evolução de sessão** — regiões trabalhadas, técnicas, escala de dor, resposta e recomendações.
          8. **WhatsApp** — confirmação, lembrete e reativação; Evolution API entra como integração separada.

          ## Ordem de implementação da interface

          - Fase A: colocar Agenda, Clientes e Caixa em produção para a primeira cliente.
          - Fase B: telas de Pacotes, Anamnese e Evolução usando as tabelas da migration 035.
          - Fase C: Evolution API, sinal de reserva, política de cancelamento e automações.
          - Fase D: multiempresa SaaS, cobrança e painel administrativo.

          ## Regra de produto

          Módulos que não fizerem sentido para um negócio devem poder ser ocultados. A Agelya deve continuar servindo massoterapia, estética, lash/brow, salão e outros serviços sem obrigar todos os clientes a usar estoque ou PDV completo.
          EOF

          cat > docs/UPSTREAM.md <<'EOF'
          # Sincronização com o Pronto

          A Agelya foi inicializada a partir do Pronto self-hosted para aproveitar uma base de agenda/CRM/POS já madura.

          Upstream: `SGrappelli/pronto`

          Commit importado inicialmente: `899cb21818cac86ce89b838d48265fb8ef4f1376` (13/08/2026).

          ## Estratégia

          A Agelya não deve fazer merge cego de todo o upstream depois que os domínios começarem a divergir. Para atualizações futuras:

          1. buscar o último commit do Pronto;
          2. revisar correções de booking, segurança, Supabase, mobile e notificações;
          3. portar/cherry-pick apenas mudanças relevantes;
          4. executar build e revisar migrations/RLS antes de produção.

          Correções de concorrência de agenda, segurança e compatibilidade têm prioridade sobre novidades comerciais do upstream.
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        env:
          DISABLE_PWA: 'true'
        run: npm run build

      - name: Commit validated foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agelya Foundation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: apply Agelya wellness foundation [foundation-complete]"
          git push origin HEAD
