name: Automations and security final validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automations-security-finalize.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Apply automation translations from the prepared translation script
        run: |
          node <<'NODE'
          const fs = require('fs')
          const yaml = fs.readFileSync('.github/workflows/automations-i18n-once.yml', 'utf8')
          const marker = "          node <<'NODE'\n"
          const start = yaml.indexOf(marker)
          const end = yaml.indexOf('\n          NODE', start + marker.length)
          if (start === -1 || end === -1) throw new Error('Translation script not found')
          let script = yaml.slice(start + marker.length, end)
          script = script.split('\n').map((line) => line.startsWith('          ') ? line.slice(10) : line).join('\n')
          fs.writeFileSync('/tmp/apply-automations-i18n.js', script)
          NODE
          node /tmp/apply-automations-i18n.js

      - name: Finalize public booking confirmation UX and remove visible legacy messenger copy
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/book/[slug]/booking-form.tsx'
          let s = fs.readFileSync(path, 'utf8')

          s = s.replace('  telegramBotUsername: string | null\n  viberBotUri: string | null', '  telegramBotUsername?: string | null\n  viberBotUri?: string | null')
          s = s.replace(
            '  const [clientHasTelegram, setClientHasTelegram] = useState(false)\n',
            '  const [clientHasTelegram, setClientHasTelegram] = useState(false)\n  const [awaitingConfirmation, setAwaitingConfirmation] = useState(false)\n'
          )
          s = s.replace(
            '      setClientHasTelegram(data.hasTelegram ?? false)\n      setStep(\'done\')',
            '      setClientHasTelegram(data.hasTelegram ?? false)\n      setAwaitingConfirmation(Boolean(data.awaitingConfirmation))\n      setStep(\'done\')'
          )
          s = s.replace(
            '    setClientHasTelegram(false)\n    setBookingError(null)',
            '    setClientHasTelegram(false)\n    setAwaitingConfirmation(false)\n    setBookingError(null)'
          )
          s = s.replace(
            "{t('success.heading')}</h2>",
            "{t(awaitingConfirmation ? 'success.pendingHeading' : 'success.heading')}</h2>"
          )
          s = s.replace(
            "{t('success.body')}</p>",
            "{t(awaitingConfirmation ? 'success.pendingBody' : 'success.body')}</p>"
          )

          const replacements = [
            ['Adicionar ao Google Agenda', "{t('addToGoogleCalendar')}"],
            ['<StepBadge label="Escolha o serviço" />', "<StepBadge label={t('stepSelectService')} />"],
            ['<StepBadge label="Escolha o profissional" />', "<StepBadge label={t('stepChooseSpecialist')} />"],
            ['<StepBadge label="Data e horário" />', "<StepBadge label={t('stepDatetime')} />"],
            ['⚠ Este horário acabou de ser reservado. Escolha outro horário.', "{t('slotTaken')}"],
            ['Carregando horários disponíveis&hellip;', "{t('loadingTimes')}"],
            ['Este dia está fora do horário de atendimento. Escolha outra data.', "{t('dayClosed')}"],
            ['Não há horários disponíveis neste dia. Escolha outra data.', "{t('noSlots')}"],
          ]
          for (const [from, to] of replacements) s = s.replaceAll(from, to)

          fs.writeFileSync(path, s)

          const pending = {
            pt: {
              heading: 'Horário reservado!',
              body: 'Enviamos uma mensagem no WhatsApp. Responda SIM para confirmar seu agendamento.'
            },
            en: {
              heading: 'Time reserved!',
              body: 'We sent you a WhatsApp message. Reply YES to confirm your appointment.'
            },
            es: {
              heading: '¡Horario reservado!',
              body: 'Te enviamos un mensaje por WhatsApp. Responde SÍ para confirmar tu cita.'
            },
            it: {
              heading: 'Orario riservato!',
              body: 'Ti abbiamo inviato un messaggio WhatsApp. Rispondi SÌ per confermare l’appuntamento.'
            },
          }
          for (const [locale, copy] of Object.entries(pending)) {
            const messagePath = `messages/${locale}.json`
            const json = JSON.parse(fs.readFileSync(messagePath, 'utf8'))
            json.publicBooking.success.pendingHeading = copy.heading
            json.publicBooking.success.pendingBody = copy.body
            fs.writeFileSync(messagePath, JSON.stringify(json, null, 2) + '\n')
          }
          NODE

      - name: Check tracked environment files
        run: |
          tracked_env=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.(example|sample|template)$' || true)
          if [ -n "$tracked_env" ]; then
            echo "Potential committed environment files:"
            echo "$tracked_env"
            exit 1
          fi

      - name: Check service-role secrets are not referenced by client components
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const roots = ['app', 'components', 'lib']
          const bad = []
          function walk(dir) {
            if (!fs.existsSync(dir)) return
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name)
              if (entry.isDirectory()) walk(p)
              else if (/\.(ts|tsx)$/.test(p)) {
                const text = fs.readFileSync(p, 'utf8')
                if (/^['\"]use client['\"]/m.test(text) && /SUPABASE_SERVICE_ROLE_KEY|CRON_SECRET|INTERNAL_API_SECRET/.test(text)) bad.push(p)
              }
            }
          }
          roots.forEach(walk)
          if (bad.length) {
            console.error('Server secrets referenced in client files:', bad)
            process.exit(1)
          }
          console.log('No server-only secret variables found in client components.')
          NODE

      - name: Production dependency audit
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const report = require('/tmp/npm-audit.json')
          const v = report.metadata?.vulnerabilities ?? {}
          console.log('Production dependency vulnerabilities:', JSON.stringify(v))
          if ((v.critical ?? 0) > 0) {
            console.error('Critical production dependency vulnerability found.')
            process.exit(1)
          }
          NODE

      - name: Build
        env:
          DISABLE_PWA: 'true'
        run: npm run build

      - name: Commit validated changes
        run: |
          git config user.name 'Agelya Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'app/book/[slug]/booking-form.tsx' messages/pt.json messages/en.json messages/es.json messages/it.json
          git diff --cached --quiet && exit 0
          git commit -m 'feat: finalize localized automation confirmation flow'
          git push
