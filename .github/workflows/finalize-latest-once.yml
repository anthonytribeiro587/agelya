name: Finalize latest Agelya automations

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-latest-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Supabase types
        run: node scripts/patch-agelya-automation-types.js

      - name: Apply translations
        run: node scripts/apply-agelya-automation-i18n.js

      - name: Patch booking UX
        run: node scripts/patch-booking-confirmation-ux.js

      - name: Install dependencies
        run: npm ci

      - name: Security checks
        run: |
          TRACKED_ENV=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.(example|sample|template)$' || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "$TRACKED_ENV"
            exit 1
          fi
          npm audit --omit=dev --json > /tmp/audit.json || true
          node -e "const r=require('/tmp/audit.json'); const v=r.metadata?.vulnerabilities||{}; console.log('Production audit:',v); if((v.critical||0)>0) process.exit(1)"

      - name: Build
        env:
          DISABLE_PWA: "true"
        run: npm run build

      - name: Commit validated files
        run: |
          git config user.name "Agelya Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/supabase/database.types.ts app/book/[slug]/booking-form.tsx messages/pt.json messages/en.json messages/es.json messages/it.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: finalize secure automation workflow"
          git push
