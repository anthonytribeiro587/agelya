name: Confirmation summary copy patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/confirmation-summary-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update translations
        run: |
          node <<'NODE'
          const fs = require('fs')
          const copy = {
            pt: {
              pendingBody: 'Seu horário foi reservado. No dia anterior ao atendimento, enviaremos uma mensagem pelo WhatsApp para você confirmar.',
              summary: {
                summaryTitle: 'Resumo das confirmações de amanhã',
                summaryDescription: 'No fim do dia, a Agelya envia para você um resumo com quem confirmou os atendimentos do dia seguinte, quem ainda não respondeu e quem cancelou.',
                summaryEnable: 'Enviar resumo diário',
                summaryEnableHint: 'A Agelya envia apenas uma vez por dia, no horário definido abaixo.',
                summaryPhone: 'WhatsApp da profissional',
                summaryPhoneHint: 'Número que receberá o resumo. Informe código do país e DDD.',
                summaryTime: 'Horário do resumo',
                summaryTimeHint: 'Usa o fuso horário configurado no negócio.',
                summarySave: 'Salvar resumo',
                summarySaving: 'Salvando…',
                summarySaved: 'Resumo diário configurado.',
                summaryTest: 'Enviar resumo de teste',
                summaryTesting: 'Enviando…',
                summaryTestSuccess: 'Resumo enviado. Confirmados: {confirmed} · Aguardando: {waiting} · Cancelados: {cancelled}.',
                summaryTestError: 'Não foi possível enviar o resumo de teste.',
                summarySaveError: 'Não foi possível salvar o resumo diário.',
                summaryLoadError: 'Não foi possível carregar a configuração do resumo.',
                summaryLoading: 'Carregando resumo diário…'
              }
            },
            en: {
              pendingBody: 'Your appointment has been reserved. The day before your visit, we will send you a WhatsApp message to confirm it.',
              summary: {
                summaryTitle: "Tomorrow's confirmation summary",
                summaryDescription: "At the end of the day, Agelya sends you a WhatsApp summary showing who confirmed tomorrow's appointments, who has not replied and who cancelled.",
                summaryEnable: 'Send daily summary',
                summaryEnableHint: 'Agelya sends it once a day at the time configured below.',
                summaryPhone: "Professional's WhatsApp",
                summaryPhoneHint: 'Number that will receive the summary, including country and area code.',
                summaryTime: 'Summary time',
                summaryTimeHint: "Uses the business's configured time zone.",
                summarySave: 'Save summary',
                summarySaving: 'Saving…',
                summarySaved: 'Daily summary configured.',
                summaryTest: 'Send test summary',
                summaryTesting: 'Sending…',
                summaryTestSuccess: 'Summary sent. Confirmed: {confirmed} · Waiting: {waiting} · Cancelled: {cancelled}.',
                summaryTestError: 'Could not send the test summary.',
                summarySaveError: 'Could not save the daily summary.',
                summaryLoadError: 'Could not load the summary settings.',
                summaryLoading: 'Loading daily summary…'
              }
            },
            es: {
              pendingBody: 'Tu cita fue reservada. El día anterior te enviaremos un mensaje por WhatsApp para que la confirmes.',
              summary: {
                summaryTitle: 'Resumen de confirmaciones de mañana',
                summaryDescription: 'Al final del día, Agelya te envía por WhatsApp un resumen de quién confirmó las citas del día siguiente, quién aún no respondió y quién canceló.',
                summaryEnable: 'Enviar resumen diario',
                summaryEnableHint: 'Agelya lo envía una vez al día en el horario definido abajo.',
                summaryPhone: 'WhatsApp del profesional',
                summaryPhoneHint: 'Número que recibirá el resumen, con código de país y área.',
                summaryTime: 'Horario del resumen',
                summaryTimeHint: 'Usa la zona horaria configurada del negocio.',
                summarySave: 'Guardar resumen',
                summarySaving: 'Guardando…',
                summarySaved: 'Resumen diario configurado.',
                summaryTest: 'Enviar resumen de prueba',
                summaryTesting: 'Enviando…',
                summaryTestSuccess: 'Resumen enviado. Confirmados: {confirmed} · Pendientes: {waiting} · Cancelados: {cancelled}.',
                summaryTestError: 'No se pudo enviar el resumen de prueba.',
                summarySaveError: 'No se pudo guardar el resumen diario.',
                summaryLoadError: 'No se pudo cargar la configuración del resumen.',
                summaryLoading: 'Cargando resumen diario…'
              }
            },
            it: {
              pendingBody: "Il tuo appuntamento è stato prenotato. Il giorno prima ti invieremo un messaggio WhatsApp per confermarlo.",
              summary: {
                summaryTitle: 'Riepilogo delle conferme di domani',
                summaryDescription: 'A fine giornata Agelya ti invia su WhatsApp un riepilogo di chi ha confermato gli appuntamenti del giorno successivo, chi non ha ancora risposto e chi ha annullato.',
                summaryEnable: 'Invia riepilogo giornaliero',
                summaryEnableHint: "Agelya lo invia una volta al giorno all'orario definito qui sotto.",
                summaryPhone: 'WhatsApp del professionista',
                summaryPhoneHint: 'Numero che riceverà il riepilogo, con prefisso internazionale e locale.',
                summaryTime: 'Orario del riepilogo',
                summaryTimeHint: "Usa il fuso orario configurato per l'attività.",
                summarySave: 'Salva riepilogo',
                summarySaving: 'Salvataggio…',
                summarySaved: 'Riepilogo giornaliero configurato.',
                summaryTest: 'Invia riepilogo di prova',
                summaryTesting: 'Invio…',
                summaryTestSuccess: 'Riepilogo inviato. Confermati: {confirmed} · In attesa: {waiting} · Annullati: {cancelled}.',
                summaryTestError: 'Impossibile inviare il riepilogo di prova.',
                summarySaveError: 'Impossibile salvare il riepilogo giornaliero.',
                summaryLoadError: 'Impossibile caricare la configurazione del riepilogo.',
                summaryLoading: 'Caricamento riepilogo giornaliero…'
              }
            }
          }

          for (const locale of Object.keys(copy)) {
            const path = `messages/${locale}.json`
            const data = JSON.parse(fs.readFileSync(path, 'utf8'))
            data.publicBooking.success.pendingBody = copy[locale].pendingBody
            data.automations = { ...data.automations, ...copy[locale].summary }
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n')
          }
          NODE
      - name: Commit translations
        run: |
          git config user.name "Agelya Bot"
          git config user.email "actions@users.noreply.github.com"
          git add messages/*.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: align confirmation copy with day-before flow"
          git push
