name: Automations i18n one-time

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automations-i18n-once.yml'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - name: Add automation translations
