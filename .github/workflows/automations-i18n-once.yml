          for (const [locale, values] of Object.entries(translations)) {
            const path = `messages/${locale}.json`
            const json = JSON.parse(fs.readFileSync(path, 'utf8'))
            json.sidebar.automations = values.sidebar
            json.automations = values.automations
            fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n')
          }
          NODE
      - name: Build
        env:
          DISABLE_PWA: 'true'
        run: npm run build
      - name: Commit translations
        run: |
          git config user.name 'Agelya Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add messages/pt.json messages/en.json messages/es.json messages/it.json
          git diff --cached --quiet && exit 0
          git commit -m 'feat: localize automation management'
          git push
