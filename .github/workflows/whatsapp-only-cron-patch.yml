name: WhatsApp-only cron one-time patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/whatsapp-only-cron-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Disable legacy notification channels
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/api/cron/notify/route.ts'
          let text = fs.readFileSync(path, 'utf8')

          // Deduplication now represents the channel actually being used.
          text = text.replace("channel: 'email',", "channel: 'whatsapp',")

          // Do not consume notification log entries for contacts that cannot
          // receive WhatsApp.
          text = text.replaceAll(
            'if (!client?.telegram_id && !client?.email && !client?.viber_user_id && !client?.whatsapp_number) continue',
            'if (!client?.whatsapp_number) continue'
          )
          text = text.replaceAll(
            'if (!c.email && !c.whatsapp_number && !c.viber_user_id && !c.telegram_id) continue',
            'if (!c.whatsapp_number) continue'
          )

          // Keep legacy code available for future reference but make it
          // unreachable: Agelya currently sends notifications only via Evolution.
          text = text.replaceAll('if (biz?.telegram_bot_token &&', 'if (false && biz?.telegram_bot_token &&')
          text = text.replaceAll('if (biz?.viber_bot_token &&', 'if (false && biz?.viber_bot_token &&')
          text = text.replaceAll('if (client?.email) {', 'if (false && client?.email) {')
          text = text.replaceAll('if (c.email) {', 'if (false && c.email) {')

          // Update stale top-level documentation.
          text = text.replace(/\* Каждое событие отправляется через все доступные каналы:[\s\S]*?\*\/\n/, '* Agelya envia estes eventos exclusivamente pelo WhatsApp via Evolution API.\n */\n')

          fs.writeFileSync(path, text)
          NODE
      - name: Commit patch
        run: |
          git config user.name "Agelya Bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/api/cron/notify/route.ts'
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep automated notifications WhatsApp-only"
          git push
