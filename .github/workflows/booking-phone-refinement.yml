name: Booking phone refinement once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/booking-phone-refinement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refine country detection and form validation
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/book/[slug]/booking-form.tsx'
          let s = fs.readFileSync(path, 'utf8')

          const oldCountryBlock = `  useEffect(() => {\n    const availablePhoneCountries = new Set(getCountries())\n    const localeRegion = navigator.language.split('-')[1]?.toUpperCase() as Country | undefined\n    if (localeRegion && availablePhoneCountries.has(localeRegion)) {\n      setPhoneCountry(localeRegion)\n      return\n    }\n\n    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone\n    if (tz.startsWith('Australia/')) setPhoneCountry('AU')\n    else if (tz === 'Europe/Lisbon' || tz === 'Atlantic/Madeira' || tz === 'Atlantic/Azores') setPhoneCountry('PT')\n    else if (tz.startsWith('America/')) setPhoneCountry('BR')\n  }, [])`

          const newCountryBlock = `  useEffect(() => {\n    const availablePhoneCountries = new Set(getCountries())\n    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone\n    const brazilTimezones = new Set([\n      'America/Sao_Paulo', 'America/Fortaleza', 'America/Recife', 'America/Bahia',\n      'America/Maceio', 'America/Belem', 'America/Santarem', 'America/Manaus',\n      'America/Boa_Vista', 'America/Cuiaba', 'America/Campo_Grande',\n      'America/Porto_Velho', 'America/Rio_Branco', 'America/Eirunepe',\n      'America/Araguaina', 'America/Noronha',\n    ])\n\n    // Prefer timezone when it clearly identifies the user's current country.\n    // This makes a Brazilian using pt-BR while physically in Australia start on +61.\n    if (tz.startsWith('Australia/')) {\n      setPhoneCountry('AU')\n      return\n    }\n    if (brazilTimezones.has(tz)) {\n      setPhoneCountry('BR')\n      return\n    }\n    if (tz === 'Europe/Lisbon' || tz === 'Atlantic/Madeira' || tz === 'Atlantic/Azores') {\n      setPhoneCountry('PT')\n      return\n    }\n\n    // For other countries, use the first browser language that includes a region.\n    for (const language of navigator.languages) {\n      const match = language.match(/[-_]([A-Za-z]{2})\\b/)\n      const region = match?.[1]?.toUpperCase() as Country | undefined\n      if (region && availablePhoneCountries.has(region)) {\n        setPhoneCountry(region)\n        return\n      }\n    }\n  }, [])`

          if (!s.includes(oldCountryBlock)) throw new Error('country block not found')
          s = s.replace(oldCountryBlock, newCountryBlock)

          const employeeNeedle = `  const selectedEmployeeObj = employees.find((e) => e.id === selectedEmployee) ?? null`
          if (!s.includes('const contactValid =')) {
            s = s.replace(
              employeeNeedle,
              `${employeeNeedle}\n  const contactValid = Boolean(\n    contact.name.trim() && contact.phone && isValidPhoneNumber(contact.phone)\n  )`
            )
          }

          s = s.replace('disabled={!contact.name || saving}', 'disabled={!contactValid || saving}')
          s = s.replaceAll("(!contact.name || saving) ? '#C4BAB3' : 'var(--brand)'", "(!contactValid || saving) ? '#C4BAB3' : 'var(--brand)'")
          s = s.replaceAll("(!contact.name || saving) ? 'not-allowed' : 'pointer'", "(!contactValid || saving) ? 'not-allowed' : 'pointer'")

          // Small UX cleanup on the same public flow.
          s = s.replace('<StepBadge label="Select service" />', '<StepBadge label="Escolha o serviço" />')
          s = s.replace('<StepBadge label="Choose specialist" />', '<StepBadge label="Escolha o profissional" />')
          s = s.replace('<StepBadge label="Date & time" />', '<StepBadge label="Data e horário" />')
          s = s.replace('Loading available times&hellip;', 'Carregando horários disponíveis&hellip;')
          s = s.replace('This day is outside working hours. Please choose another date.', 'Este dia está fora do horário de atendimento. Escolha outra data.')
          s = s.replace('No available times for this day. Please choose another date.', 'Não há horários disponíveis neste dia. Escolha outra data.')
          s = s.replace('⚠ This time was just booked by someone else. Please choose a different time.', '⚠ Este horário acabou de ser reservado. Escolha outro horário.')
          s = s.replace('Add to Google Calendar', 'Adicionar ao Google Agenda')
          s = s.replace("{selectedService?.name} · {date} at {time ? formatSlot(time) : ''}", "{selectedService?.name} · {date} às {time ? formatSlot(time) : ''}")

          fs.writeFileSync(path, s)
          NODE

      - name: Build
        env:
          DISABLE_PWA: 'true'
        run: npm ci && npm run build

      - name: Commit
        run: |
          git config user.name "Agelya Bot"
          git config user.email "actions@users.noreply.github.com"
          git add 'app/book/[slug]/booking-form.tsx'
          git diff --cached --quiet && exit 0
          git commit -m "fix: refine international booking phone UX"
          git push
