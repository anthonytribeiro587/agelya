name: Production WhatsApp automation E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'e2e/production-whatsapp-automations.mjs'
      - '.github/workflows/e2e-whatsapp-production.yml'

permissions:
  contents: read

jobs:
  whatsapp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install chromium
      - name: Run production WhatsApp automation E2E
        env:
          E2E_BASE_URL: https://agelya.vercel.app
        run: |
          mkdir -p wa-artifacts
          node e2e/production-whatsapp-automations.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-whatsapp-automation-e2e
          path: wa-artifacts/
          if-no-files-found: ignore
          retention-days: 3
