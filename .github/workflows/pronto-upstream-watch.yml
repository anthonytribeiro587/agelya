name: Pronto Upstream Watch

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agelya
        uses: actions/checkout@v4

      - name: Check latest Pronto commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PINNED="$(tr -d '[:space:]' < .upstream-pronto)"
          LATEST="$(git ls-remote https://github.com/SGrappelli/pronto.git refs/heads/main | awk '{print $1}')"

          if [ -z "$LATEST" ] || [ "$LATEST" = "$PINNED" ]; then
            echo "Agelya is already aligned with the pinned Pronto commit."
            exit 0
          fi

          EXISTING="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'Pronto upstream update available in:title' \
            --json number \
            --jq 'length')"

          if [ "$EXISTING" != "0" ]; then
            echo "An upstream review issue is already open."
            exit 0
          fi

          cat > /tmp/upstream-body.md <<EOF
          O Pronto recebeu commits depois da versão atualmente importada pela Agelya.

          - Commit fixado na Agelya: \`$PINNED\`
          - Último commit do Pronto: \`$LATEST\`

          Revisar principalmente mudanças em **booking/double booking, segurança, Supabase/RLS, mobile e notificações** antes de portar qualquer alteração.

          Upstream: https://github.com/SGrappelli/pronto

          Depois de revisar/portar as mudanças relevantes, atualize o arquivo \`.upstream-pronto\` com o SHA revisado e feche esta issue.
          EOF

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pronto upstream update available: ${LATEST:0:7}" \
            --body-file /tmp/upstream-body.md
