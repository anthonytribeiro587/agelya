name: Fix WhatsApp cron types once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-whatsapp-cron-types.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix unreachable legacy channel guards
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'app/api/cron/notify/route.ts'
          let s = fs.readFileSync(path, 'utf8')
          s = s.replaceAll('if (false && biz?.telegram_bot_token &&', 'if (biz && false && biz.telegram_bot_token &&')
          s = s.replaceAll('if (false && biz?.viber_bot_token &&', 'if (biz && false && biz.viber_bot_token &&')
          fs.writeFileSync(path, s)
          NODE
      - name: Commit
        run: |
          git config user.name "Agelya Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/cron/notify/route.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: narrow legacy notification guards"
          git push
